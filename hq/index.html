<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="googlebot" content="noindex,nofollow">
<title>Opticircle Command Center</title><meta name="theme-color" content="#004176">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Opticircle HQ">
<link rel="preload" href="fonts/jost-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css"></head><body>
<div id="gate" class="gate"><form id="gateForm"><img src="icons/icon-192.png" alt="" width="72" height="72">
<p class="eyebrow">Opticircle HQ</p><h1>Command <em>Center</em></h1>
<input id="pass" type="password" inputmode="text" autocomplete="current-password" placeholder="Passcode" aria-label="Passcode">
<button>Enter</button><p id="gateErr" class="err" hidden>Wrong passcode</p></form></div>
<div id="app" hidden>
<header class="top"><div class="wrap topin"><div class="brand"><img src="icons/icon-192.png" alt="" width="34" height="34"><div><b>Opticircle</b><span>Command Center</span></div></div>
<div class="topact"><button id="installBtn" class="ghost" hidden>Install app</button><button id="refresh" class="ghost" aria-label="Refresh">↻</button></div></div>
<nav class="tabs wrap" id="tabs"></nav></header>
<main class="wrap" id="main"></main>
<footer class="wrap foot" id="foot"></footer></div>
<div id="iosHint" class="toast" hidden>On iPhone: tap Share, then “Add to Home Screen”. <button onclick="this.parentNode.hidden=true">OK</button></div>
<script src="app.js"></script></body></html>
